# 关闭「virbr0 就绪前 VM 流量不被代理」的时序窗口（docs/11 P2-4 / docs/12 R1）
#
# 现状：unit 的 After= 里没有 libvirtd，而 ebpf inbound 的 shared.interface=["virbr0"]。
#       实测 boot 0：libvirtd 就绪 08:44:31、sing-box 启动 08:44:35 —— 裕量仅 4 秒。
# 机制：缺接口不会让 sing-box 启动失败（fork 文档：会重试），所以这是"VM 网络短时空窗"，
#       不是"整机网络不稳"的主因。加这两行只为把这个窗口关掉，代价为零。
# 说明：systemd 的依赖类设置（After/Wants）在 drop-in 中是**追加**语义，不会覆盖原 unit 的值。
#
# 安装： sudo install -D -m644 systemd/40-libvirtd-order.conf \
#          /etc/systemd/system/sing-box.service.d/40-libvirtd-order.conf
#        sudo systemctl daemon-reload && sudo systemctl restart sing-box
# 验证： systemctl show sing-box -p After | tr ' ' '\n' | grep -i libvirtd
# 回滚： sudo rm /etc/systemd/system/sing-box.service.d/40-libvirtd-order.conf \
#          && sudo systemctl daemon-reload && sudo systemctl restart sing-box

[Unit]
After=libvirtd.service
Wants=libvirtd.service
