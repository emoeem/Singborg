# 收紧 sing-box 落盘文件的权限（docs/11 P2-2）
#
# 现状：/var/lib/sing-box/cache.db 权限 0644、目录 0755；而 cache_file.store_dns=true
#       意味着 DNS 查询/答案会落盘 —— 同机任何本地用户都能读到这份浏览痕迹的 DNS 侧记录。
#       成因是 unit 未显式设置 UMask（systemd 默认 0022）。
# 影响：仅影响 sing-box 今后**新建**的文件；已有的 cache.db 需要一次性 chmod。
#       面板 (sing-box-panel) 与 sing-box 都以 root 运行，收权限不影响它们读写。
#
# 安装： sudo install -D -m644 systemd/30-umask-hardening.conf \
#          /etc/systemd/system/sing-box.service.d/30-umask-hardening.conf
#        sudo chmod 600 /var/lib/sing-box/cache.db
#        sudo systemctl daemon-reload && sudo systemctl restart sing-box
# 验证： systemctl show sing-box -p UMask -p StateDirectoryMode     # 期望 0077 / 0750
#        ls -l /var/lib/sing-box/cache.db                          # 期望 -rw------- root root
#        stat -c '%a %n' /var/lib/sing-box                         # 期望 750
# 回滚： sudo rm /etc/systemd/system/sing-box.service.d/30-umask-hardening.conf \
#          && sudo systemctl daemon-reload && sudo systemctl restart sing-box
#        （目录/文件权限如需复原：chmod 755 /var/lib/sing-box; chmod 644 /var/lib/sing-box/cache.db）

[Service]
UMask=0077
StateDirectoryMode=0750
